<!DOCTYPE html>
<html lang="en" x-data="app()" x-init="init">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amkyaw.Dev - Knowledge Base Server</title>
    
    <!-- Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body :class="{ 'dark-theme': isDark }">
    <!-- Navigation with Hamburger Menu -->
    <nav class="navbar" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item" href="index.html">
                    <img src="assets/images/logo.svg" alt="Amkyaw.Dev" width="112" height="28">
                </a>
                
                <!-- Hamburger Menu -->
                <a role="button" class="navbar-burger" :class="{ 'is-active': isMenuOpen }" 
                   @click="toggleMenu" aria-label="menu" aria-expanded="false">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>

            <!-- Navbar Menu -->
            <div class="navbar-menu" :class="{ 'is-active': isMenuOpen }">
                <div class="navbar-start">
                    <a class="navbar-item" href="index.html">Home</a>
                    <a class="navbar-item" href="pages/search.html">Search</a>
                    <a class="navbar-item" href="pages/categories.html">Categories</a>
                    <a class="navbar-item" href="pages/api-docs.html">API</a>
                    <a class="navbar-item" href="pages/about.html">About</a>
                </div>

                <div class="navbar-end">
                    <div class="navbar-item">
                        <!-- Theme Switcher -->
                        <button class="button is-ghost" @click="toggleTheme">
                            <i class="fas" :class="isDark ? 'fa-sun' : 'fa-moon'"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section with 3D Animation -->
    <section class="hero is-fullheight-with-navbar">
        <div class="hero-body">
            <div class="container has-text-centered">
                <!-- 3D Title Animation -->
                <h1 class="title-3d mb-6">
                    <span class="block" x-text="title1"></span>
                    <span class="block gradient-text" x-text="title2"></span>
                </h1>
                
                <!-- Neon Buttons -->
                <div class="buttons is-centered">
                    <a href="pages/search.html" class="button neon-button is-large mx-2">
                        <span class="icon"><i class="fas fa-search"></i></span>
                        <span>Search Knowledge</span>
                    </a>
                    <a href="pages/api-playground.html" class="button neon-button is-large mx-2">
                        <span class="icon"><i class="fas fa-code"></i></span>
                        <span>Try API</span>
                    </a>
                </div>

                <!-- Stats Cards -->
                <div class="columns is-multiline mt-6" x-show="stats">
                    <div class="column is-3">
                        <div class="box stat-card">
                            <p class="heading">Categories</p>
                            <p class="title" x-text="stats.categories"></p>
                        </div>
                    </div>
                    <div class="column is-3">
                        <div class="box stat-card">
                            <p class="heading">Knowledge Items</p>
                            <p class="title" x-text="stats.items"></p>
                        </div>
                    </div>
                    <div class="column is-3">
                        <div class="box stat-card">
                            <p class="heading">API Calls</p>
                            <p class="title" x-text="stats.apiCalls"></p>
                        </div>
                    </div>
                    <div class="column is-3">
                        <div class="box stat-card">
                            <p class="heading">Users</p>
                            <p class="title" x-text="stats.users"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Background Animation -->
        <div class="background-animation">
            <div class="floating-shapes"></div>
        </div>
    </section>

    <!-- Alpine.js Component -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('app', () => ({
                isMenuOpen: false,
                isDark: false,
                title1: 'Amkyaw.Dev',
                title2: 'Knowledge Base Server',
                stats: {
                    categories: 5,
                    items: 128,
                    apiCalls: '10K+',
                    users: '500+'
                },
                
                init() {
                    // Check for saved theme
                    this.isDark = localStorage.getItem('theme') === 'dark';
                    this.applyTheme();
                    
                    // Load stats from API
                    this.loadStats();
                },
                
                toggleMenu() {
                    this.isMenuOpen = !this.isMenuOpen;
                },
                
                toggleTheme() {
                    this.isDark = !this.isDark;
                    localStorage.setItem('theme', this.isDark ? 'dark' : 'light');
                    this.applyTheme();
                },
                
                applyTheme() {
                    if (this.isDark) {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    } else {
                        document.documentElement.removeAttribute('data-theme');
                    }
                },
                
                async loadStats() {
                    try {
                        const response = await fetch('/api/v1/health');
                        const data = await response.json();
                        // Update stats from API
                    } catch (error) {
                        console.log('Using default stats');
                    }
                }
            }));
        });
    </script>

    <!-- Custom JavaScript -->
    <script src="js/theme-switcher.js"></script>
    <script src="js/utils.js"></script>
</body>
</html>
