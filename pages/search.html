<!DOCTYPE html>
<html lang="en" x-data="searchApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Knowledge Server</title>
    
    <!-- Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <!-- Navbar (same as index.html) -->
    <nav class="navbar is-primary" x-data="{ mobileMenuOpen: false }">
        <!-- ... same navbar code ... -->
    </nav>

    <!-- Search Section -->
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-half">
                    <div class="field has-addons">
                        <div class="control is-expanded">
                            <input class="input is-large" type="text" 
                                   x-model="searchQuery" 
                                   @keyup.enter="search"
                                   placeholder="Enter your search term...">
                        </div>
                        <div class="control">
                            <button class="button is-primary is-large" @click="search" 
                                    :class="{ 'is-loading': isLoading }">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="tags are-medium">
                        <span class="tag is-info" @click="searchQuery = 'chatbot'; search()">chatbot</span>
                        <span class="tag is-info" @click="searchQuery = 'javascript'; search()">javascript</span>
                        <span class="tag is-info" @click="searchQuery = 'image'; search()">image</span>
                        <span class="tag is-info" @click="searchQuery = 'api'; search()">api</span>
                    </div>
                </div>
            </div>
            
            <!-- Results -->
            <div class="columns is-centered mt-6">
                <div class="column is-two-thirds">
                    <template x-if="results.length > 0">
                        <div>
                            <h2 class="title is-4 mb-4" x-text="`Found ${results.length} results`"></h2>
                            <div class="list is-hoverable">
                                <template x-for="item in results" :key="item.id">
                                    <a :href="`item.html?category=${item.category}&id=${item.id}`" 
                                       class="list-item has-text-left p-4 mb-2" 
                                       x-show="true" 
                                       x-transition>
                                        <div class="is-flex is-align-items-center">
                                            <span class="tag is-primary mr-3" x-text="item.category"></span>
                                            <span x-text="item.title"></span>
                                        </div>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </template>
                    
                    <template x-if="searched && results.length === 0">
                        <div class="notification is-warning has-text-centered">
                            <i class="fas fa-exclamation-triangle mr-2"></i>
                            No results found for "<span x-text="searchQuery"></span>"
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <!-- ... same footer code ... -->
    </footer>

    <script src="../js/alpine-init.js"></script>
    <script src="../js/theme-switcher.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('searchApp', () => ({
                searchQuery: '',
                results: [],
                isLoading: false,
                searched: false,
                
                async search() {
                    if (!this.searchQuery.trim()) return;
                    
                    this.isLoading = true;
                    this.searched = true;
                    
                    // Simulate API call
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    this.results = [
                        { id: 1, title: 'What is a Chatbot?', category: 'chatbot' },
                        { id: 2, title: 'JavaScript Basics', category: 'coder' },
                        { id: 3, title: 'Image Formats Explained', category: 'image' }
                    ].filter(item => 
                        item.title.toLowerCase().includes(this.searchQuery.toLowerCase())
                    );
                    
                    this.isLoading = false;
                }
            }));
        });
    </script>
</body>
</html>
