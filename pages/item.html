<!DOCTYPE html>
<html lang="en" x-data="itemApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="item ? item.question : 'Item - Knowledge Server'"></title>
    
    <!-- Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Highlight.js for code blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar is-primary" x-data="{ mobileMenuOpen: false }">
        <!-- ... same navbar code ... -->
    </nav>

    <!-- Item Content -->
    <section class="section" x-show="item">
        <div class="container">
            <div class="columns">
                <div class="column is-three-quarters">
                    <!-- Breadcrumb -->
                    <nav class="breadcrumb" aria-label="breadcrumbs">
                        <ul>
                            <li><a :href="`category.html?cat=${categoryName}`" x-text="getCategoryDisplay(categoryName)"></a></li>
                            <li class="is-active"><a href="#" aria-current="page" x-text="item?.question.substring(0,30) + '...'"></a></li>
                        </ul>
                    </nav>

                    <!-- Main Content -->
                    <div class="card">
                        <div class="card-content">
                            <div class="media">
                                <div class="media-content">
                                    <p class="title is-3" x-text="item.question"></p>
                                    <div class="tags">
                                        <template x-for="keyword in item.keywords" :key="keyword">
                                            <span class="tag is-info is-light" x-text="keyword"></span>
                                        </template>
                                    </div>
                                </div>
                            </div>

                            <div class="content mt-5">
                                <div class="box has-background-light" x-html="formattedAnswer"></div>
                            </div>

                            <!-- Metadata -->
                            <div class="columns is-multiline mt-4">
                                <div class="column is-half">
                                    <div class="field is-grouped is-grouped-multiline">
                                        <div class="control">
                                            <div class="tags has-addons">
                                                <span class="tag is-dark">ID</span>
                                                <span class="tag is-info" x-text="item.id"></span>
                                            </div>
                                        </div>
                                        <div class="control">
                                            <div class="tags has-addons">
                                                <span class="tag is-dark">Category</span>
                                                <span class="tag is-primary" x-text="getCategoryDisplay(categoryName)"></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Related Items -->
                    <div class="card mt-5" x-show="relatedItems.length > 0">
                        <div class="card-header">
                            <p class="card-header-title">Related Items</p>
                        </div>
                        <div class="card-content">
                            <div class="list">
                                <template x-for="item in relatedItems" :key="item.id">
                                    <a :href="`item.html?category=${categoryName}&id=${item.id}`" 
                                       class="list-item p-3">
                                        <div class="is-flex is-align-items-center">
                                            <i class="fas fa-file-alt has-text-info mr-3"></i>
                                            <span x-text="item.question"></span>
                                        </div>
                                    </a>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sidebar -->
                <div class="column">
                    <div class="card">
                        <div class="card-header">
                            <p class="card-header-title">Quick Actions</p>
                        </div>
                        <div class="card-content">
                            <div class="buttons are-small">
                                <button class="button is-fullwidth mb-2" @click="copyLink">
                                    <i class="fas fa-link mr-2"></i> Copy Link
                                </button>
                                <button class="button is-fullwidth mb-2" @click="printItem">
                                    <i class="fas fa-print mr-2"></i> Print
                                </button>
                                <a :href="`https://twitter.com/intent/tweet?text=${encodeURIComponent(item.question)}&url=${window.location.href}`" 
                                   target="_blank" class="button is-fullwidth mb-2">
                                    <i class="fab fa-twitter mr-2"></i> Share
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <!-- ... same footer code ... -->
    </footer>

    <!-- Highlight.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="../js/alpine-init.js"></script>
    <script src="../js/theme-switcher.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('itemApp', () => ({
                categoryName: '',
                itemId: null,
                item: null,
                relatedItems: [],
                
                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    this.categoryName = urlParams.get('category') || 'general';
                    this.itemId = parseInt(urlParams.get('id')) || 1;
                    this.loadItem();
                },
                
                async loadItem() {
                    // Mock data
                    setTimeout(() => {
                        this.item = {
                            id: this.itemId,
                            question: `What is ${this.categoryName} and how does it work?`,
                            answer: `# ${this.categoryName.toUpperCase()}\n\nThis is a detailed explanation about ${this.categoryName}. It covers all the important aspects and provides examples.\n\n## Key Points\n\n- Point 1 about ${this.categoryName}\n- Point 2 about ${this.categoryName}\n- Point 3 about ${this.categoryName}\n\n## Code Example\n\n\`\`\`javascript\nfunction example() {\n    console.log('Hello from ${this.categoryName}');\n}\n\`\`\`\n\n## Additional Information\n\nFor more information, check the documentation.`,
                            keywords: [this.categoryName, 'example', 'guide', 'tutorial', 'help'],
                            related: [2, 3, 4, 5]
                        };
                        
                        this.relatedItems = this.item.related.map(id => ({
                            id: id,
                            question: `Related Question ${id} about ${this.categoryName}`
                        }));
                        
                        this.$nextTick(() => {
                            hljs.highlightAll();
                        });
                    }, 300);
                },
                
                get formattedAnswer() {
                    if (!this.item) return '';
                    // Simple markdown to HTML conversion
                    return this.item.answer
                        .replace(/^# (.*$)/gm, '<h1 class="title is-4">$1</h1>')
                        .replace(/^## (.*$)/gm, '<h2 class="title is-5">$1</h2>')
                        .replace(/^### (.*$)/gm, '<h3 class="title is-6">$1</h3>')
                        .replace(/\n\n/g, '</p><p>')
                        .replace(/\n/g, '<br>');
                },
                
                getCategoryDisplay(cat) {
                    const names = {
                        general: 'အထွေထွေ',
                        technical: 'နည်းပညာ',
                        chatbot: 'Chatbot',
                        coder: 'Coder',
                        image: 'Image'
                    };
                    return names[cat] || cat;
                },
                
                copyLink() {
                    navigator.clipboard.writeText(window.location.href);
                    alert('Link copied to clipboard!');
                },
                
                printItem() {
                    window.print();
                },
                
                toggleTheme() {
                    const event = new CustomEvent('toggle-theme');
                    window.dispatchEvent(event);
                }
            }));
        });
    </script>
</body>
</html>
