<!DOCTYPE html>
<html lang="en" x-data="categoryApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="categoryName + ' - Knowledge Server'"></title>
    
    <!-- Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar is-primary" x-data="{ mobileMenuOpen: false }">
        <div class="navbar-brand">
            <a class="navbar-item" href="../index.html">
                <img src="../assets/images/logo.svg" alt="Logo" style="max-height: 40px">
                <span class="has-text-weight-bold ml-2">Knowledge Server</span>
            </a>
            <a role="button" class="navbar-burger" :class="{ 'is-active': mobileMenuOpen }" @click="mobileMenuOpen = !mobileMenuOpen">
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
                <span aria-hidden="true"></span>
            </a>
        </div>
        
        <div class="navbar-menu" :class="{ 'is-active': mobileMenuOpen }">
            <div class="navbar-start">
                <a class="navbar-item" href="../index.html">Home</a>
                <a class="navbar-item" href="search.html">Search</a>
                <a class="navbar-item" href="categories.html">Categories</a>
                <a class="navbar-item" href="about.html">About</a>
                <a class="navbar-item" href="contact.html">Contact</a>
            </div>
            
            <div class="navbar-end">
                <div class="navbar-item">
                    <button class="button is-light" @click="toggleTheme">
                        <i class="fas" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Category Header -->
    <section class="hero is-info is-small" x-show="category">
        <div class="hero-body">
            <div class="container">
                <div class="columns is-vcentered">
                    <div class="column is-narrow">
                        <i :class="'fas fa-' + category.icon + ' fa-3x'"></i>
                    </div>
                    <div class="column">
                        <h1 class="title" x-text="category.displayName"></h1>
                        <h2 class="subtitle" x-text="category.nameEn"></h2>
                        <p x-text="category.description"></p>
                        <div class="tags mt-3">
                            <span class="tag is-light" x-text="category.fileCount + ' files'"></span>
                            <span class="tag is-light" x-text="category.itemCount + ' items'"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Items Section -->
    <section class="section">
        <div class="container">
            <!-- Search within category -->
            <div class="field has-addons mb-6">
                <div class="control is-expanded">
                    <input class="input" type="text" 
                           x-model="searchQuery" 
                           @keyup.enter="filterItems"
                           placeholder="Search in this category...">
                </div>
                <div class="control">
                    <button class="button is-info" @click="filterItems">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>

            <!-- Items Grid -->
            <div x-show="!loading && filteredItems.length === 0" class="has-text-centered">
                <i class="fas fa-folder-open fa-4x has-text-grey-light mb-4"></i>
                <p class="title is-4 has-text-grey">No items found</p>
                <p class="subtitle is-6 has-text-grey">Try a different search term</p>
            </div>

            <div class="list is-hoverable" x-show="filteredItems.length > 0">
                <template x-for="item in filteredItems" :key="item.id">
                    <a :href="`item.html?category=${categoryName}&id=${item.id}`" 
                       class="list-item p-4 mb-3" 
                       x-show="true" 
                       x-transition>
                        <div class="is-flex is-align-items-center is-justify-content-space-between">
                            <div>
                                <h3 class="title is-5 mb-2" x-text="item.question"></h3>
                                <p class="has-text-grey" x-text="item.answer.substring(0, 100) + '...'"></p>
                                <div class="tags mt-2">
                                    <template x-for="keyword in item.keywords.slice(0,3)" :key="keyword">
                                        <span class="tag is-light" x-text="keyword"></span>
                                    </template>
                                    <span x-show="item.keywords.length > 3" class="tag is-light">+3</span>
                                </div>
                            </div>
                            <i class="fas fa-chevron-right has-text-grey-light"></i>
                        </div>
                    </a>
                </template>
            </div>

            <!-- Loading -->
            <div x-show="loading" class="has-text-centered py-6">
                <div class="loading mb-3"></div>
                <p class="has-text-grey">Loading items...</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="content has-text-centered">
            <p>
                <strong>Knowledge Server</strong> by <a href="https://amkyaw.dev">Amkyaw.Dev</a>. 
                Source code on <a href="https://github.com/amkyawdev/knowledge-server">GitHub</a>.
            </p>
        </div>
    </footer>

    <script src="../js/alpine-init.js"></script>
    <script src="../js/theme-switcher.js"></script>
    <script src="../js/knowledge-loader.js"></script>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('categoryApp', () => ({
                categoryName: '',
                category: null,
                items: [],
                filteredItems: [],
                searchQuery: '',
                loading: true,
                
                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    this.categoryName = urlParams.get('cat') || 'general';
                    this.loadCategory();
                },
                
                async loadCategory() {
                    this.loading = true;
                    
                    // Mock data for now
                    setTimeout(() => {
                        this.category = {
                            name: this.categoryName,
                            displayName: this.getDisplayName(this.categoryName),
                            nameEn: this.getNameEn(this.categoryName),
                            description: this.getDescription(this.categoryName),
                            icon: this.getIcon(this.categoryName),
                            fileCount: 15,
                            itemCount: 120
                        };
                        
                        this.items = this.generateMockItems(20);
                        this.filteredItems = this.items;
                        this.loading = false;
                    }, 500);
                },
                
                filterItems() {
                    if (!this.searchQuery.trim()) {
                        this.filteredItems = this.items;
                        return;
                    }
                    
                    const query = this.searchQuery.toLowerCase();
                    this.filteredItems = this.items.filter(item => 
                        item.question.toLowerCase().includes(query) ||
                        item.answer.toLowerCase().includes(query) ||
                        item.keywords.some(k => k.toLowerCase().includes(query))
                    );
                },
                
                getDisplayName(cat) {
                    const names = {
                        general: 'အထွေထွေ',
                        technical: 'နည်းပညာ',
                        chatbot: 'Chatbot',
                        coder: 'Coder',
                        image: 'Image',
                        support: 'အကူအညီ'
                    };
                    return names[cat] || cat;
                },
                
                getNameEn(cat) {
                    const names = {
                        general: 'General',
                        technical: 'Technical',
                        chatbot: 'Chatbot',
                        coder: 'Coder',
                        image: 'Image',
                        support: 'Support'
                    };
                    return names[cat] || cat;
                },
                
                getDescription(cat) {
                    const desc = {
                        general: 'General knowledge and common questions',
                        technical: 'Technical documentation and guides',
                        chatbot: 'Chatbot development and AI',
                        coder: 'Programming and development',
                        image: 'Image processing and graphics',
                        support: 'Help and support articles'
                    };
                    return desc[cat] || 'Category information';
                },
                
                getIcon(cat) {
                    const icons = {
                        general: 'globe',
                        technical: 'microchip',
                        chatbot: 'robot',
                        coder: 'code',
                        image: 'image',
                        support: 'headset'
                    };
                    return icons[cat] || 'folder';
                },
                
                generateMockItems(count) {
                    const items = [];
                    for (let i = 1; i <= count; i++) {
                        items.push({
                            id: i,
                            question: `Sample Question ${i} for ${this.categoryName}`,
                            answer: `This is a detailed answer for question ${i}. It contains information about ${this.categoryName} and related topics.`,
                            keywords: ['sample', 'test', this.categoryName, 'example', 'demo'].slice(0, 3 + Math.floor(Math.random() * 3))
                        });
                    }
                    return items;
                },
                
                toggleTheme() {
                    const event = new CustomEvent('toggle-theme');
                    window.dispatchEvent(event);
                }
            }));
        });
    </script>
</body>
    </html>
